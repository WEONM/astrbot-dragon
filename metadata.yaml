name: astrbot_plugin_dragon_roulette
display_name: 龙族轮盘
short_desc: 以《龙族》为世界观的恶魔轮盘插件，支持 PvP、屠龙、组队讨伐。
desc: 以《龙族》为世界观的 AstrBot 恶魔轮盘插件。卡塞尔学院地下赌局，混血种们以言灵代替道具互相博弈，支持 PvP 对战、龙币押注、屠龙 PvE 与多人组队讨伐。
help: |
  以《龙族》为世界观的 AstrBot 恶魔轮盘插件。卡塞尔学院地下赌局，混血种们以言灵代替道具互相博弈。

  指令统一使用短指令：
    - /龙轮 规则 / 指令
    - /龙轮 创建
    - /龙轮 加入
    - /龙轮 模式 标准/极速/血牛/言灵乱斗/皇帝降临
    - /龙轮 开始
    - /龙轮 信息
    - /龙轮 图鉴
    - /龙轮 抽
    - /龙轮 换 A B
    - /龙轮 认输
    - /龙轮 丢弃 言灵名
    - /龙轮 押 1|2 金额
    - /龙轮 排行
    - /龙轮 战绩
    - /龙轮 结束
    - /龙轮 屠龙 列表|Boss名（单人挑战龙王）
    - /龙轮 组队屠龙 Boss名 / 组队加入 Boss名 / 组队开始（多人合作讨伐）

  游戏流程：
    1. 玩家1使用「/龙轮 创建」等待另一位玩家加入；
    2. 玩家2使用「/龙轮 加入」后，玩家1再使用「/龙轮 开始」进入对战；
    3. 发送「开枪/对方」攻击对方，发送「吞枪/自己」向自己开枪；
    4. 发送言灵名咏唱言灵，发送「抽」消耗生命抽取随机言灵；
    5. 对局长时间无操作将自动结束（默认 60 分钟，可在配置中调整或关闭）。

  屠龙模式（PvE 单挑龙王）：
    - /龙轮 屠龙 列表 查看四位龙王：诺顿(HP10)/芬里厄(HP14)/伊邪那美(HP12)/尼德霍格(HP16，需先击败前三者解锁)
    - /龙轮 屠龙 Boss名 发起挑战，入场费 20 龙币（dragonFee 可配置），击败得 50~150 龙币
    - 单人进行：Boss 拥有专属言灵与 AI 自动回合（血量低会防御，实弹多打人/空包多吞枪）
    - 认输/强制结束/超时按作废处理，入场费退还

  组队讨伐（PvE 2~3 人合作）：
    - /龙轮 组队屠龙 Boss名 创建房间
    - /龙轮 组队加入 Boss名 加入房间
    - /龙轮 组队开始 由创建者开始战斗
    - 每人独立血量/背包，轮流行动；人数越多 Boss 血量与伤害越高

  龙币与押注：
    - 新玩家初始 100 龙币（startCoins，可配置）；
    - 胜场 +30（winReward）、参与 +10（loseReward）、连胜每级额外 +5（streakBonus，最多 5 级）；
    - 对局开始前可「/龙轮 押 1|2 金额」下注，1:1 赔率（下注时扣除本金，押中返还本金+赢额）；
    - 强制结束 / 超时 / 等待超时：对局作废，押注全额退还；
    - 龙币与战绩保存在 data/plugin_data/astrbot_plugin_dragon_roulette/economy.json，跨重启保留。

  模式：
    - 标准：常规体验
    - 极速：低血量、短弹夹，节奏更快
    - 血牛：高血量、更多言灵，打持久战
    - 言灵乱斗：初始言灵多，首次抽卡免费
    - 皇帝降临：双方开局各获一个随机传说言灵

  抽卡保底：
    - 普通 60% / 稀有 30% / 传说 10%
    - 连续 4 抽未出稀有以上，下次必出稀有或传说
    - 连续 8 抽未出传说，下次必出传说

  言灵特色：
    - 全部采用《龙族》原著/官方设定言灵名称，现共 50 种
    - v1.9.0 新增：湮灭/怒焰/蜕生/血鳞/黄金瞳/血脉诅咒/轮回（复活/免疫治疗/反弹/禁抽/伤害强化/生命互换新机制）
    - v1.10.0：信息类言灵（风王之瞳/先知/神谕/阴流）改为私发告知，避免群聊信息泄漏
    - 包含隐藏彩蛋「言灵·皇帝」
    - 言灵图鉴附带分类图片

  配置项：
    - admin：管理员 ID 列表，可强制结束游戏
    - maxWaitTime：等待玩家2加入的最大秒数（默认 180）
    - gameTimeout：对局无操作自动结束分钟数（默认 60，0=关闭）
    - persistGames：是否跨插件重启恢复对局（默认 false）
    - startCoins / winReward / loseReward / streakBonus：龙币经济参数
    - dragonFee / dragonRewards：屠龙模式入场费与击杀奖励

